# Australia — platform-relevant regulatory instruments
# Maintainer note: highest live enforcement heat in the region. Verify fortnightly.
- id: au-smma-2024
  jurisdiction: Australia
  jurisdiction_code: AU
  instrument: Online Safety Amendment (Social Media Minimum Age) Act 2024
  citation: Cth
  regulator: eSafety
  regulator_full: Office of the eSafety Commissioner
  status: in_force
  passed: 2024-12-10
  commenced: 2025-12-10
  themes: [age_assurance]
  obligations:
    - ref: s.63C
      summary: >-
        Age-restricted social media platforms must take reasonable steps to prevent
        Australians under 16 from holding an account.
      owner_function: [product, engineering, policy, ops]
      clock: null
      evidence_required: >-
        Evidence of the steps taken and their effectiveness — age assurance method,
        detection rates, removal volumes, appeal outcomes. "Reasonable steps" is an
        effort standard, so the evidence trail is itself the deliverable.
    - ref: general
      summary: >-
        Respond to compulsory information-gathering notices issued by the Commissioner
        in relation to minimum-age compliance.
      owner_function: [legal, policy, data, ops]
      clock: Set in each notice; non-negotiable
      evidence_required: Response file, source data lineage, internal approvals
  deadlines:
    - date: 2025-12-10
      event: Obligation commenced
      certainty: fixed
    - date: 2026-06-30
      event: eSafety aiming to conclude at least some platform investigations and decide on enforcement
      certainty: expected
  penalty:
    max_financial: Up to AUD 49.5 million
    basis: Civil penalty for systemic non-compliance
    personal_liability: false
    non_financial: Public naming in compliance reporting; enforceable undertakings
  enforcement_signals:
    - date: 2026-03-01
      signal: >-
        eSafety published a Social Media Minimum Age compliance update reporting continued
        under-16 account retention and creation at the three-month mark.
      source: https://www.esafety.gov.au/newsroom/blogs/social-media-minimum-age-compliance-report
    - date: 2026-03-01
      signal: >-
        Five platforms — Facebook, Instagram, Snapchat, TikTok and YouTube — flagged for
        compliance concerns; eSafety states it is moving into an enforcement stance.
      source: https://www.esafety.gov.au/newsroom/media-releases/five-social-media-platforms-flagged-for-compliance-issues
  meta_exposure: >-
    Facebook and Instagram are named among the five platforms under investigation for
    suspected non-compliance.
  sources:
    - title: eSafety — Social media age restrictions (regulator hub)
      url: https://www.esafety.gov.au/about-us/industry-regulation/social-media-age-restrictions
      kind: regulator
      accessed: 2026-08-23
    - title: eSafety — Social Media Minimum Age Compliance Update, March 2026
      url: https://www.esafety.gov.au/sites/default/files/2026-03/SocialMediaMinimumAgeComplianceUpdateMarch2026.pdf
      kind: regulator
      accessed: 2026-08-23
    - title: eSafety — Five social media platforms flagged for compliance issues
      url: https://www.esafety.gov.au/newsroom/media-releases/five-social-media-platforms-flagged-for-compliance-issues
      kind: regulator
      accessed: 2026-08-23
  confidence: medium
  notes: >-
    This is the worked example used throughout the readiness framework. A compulsory notice
    under live investigation is the exact artefact the JD calls a "statutory information
    request" — fixed deadline, legally compelled, evidence must be defensible if published.
  last_verified: 2026-08-23
  verified_by: B. Ong

- id: au-strengthening-enforcement-2026
  jurisdiction: Australia
  jurisdiction_code: AU
  instrument: Online Safety Amendment (Strengthening Enforcement for the Social Media Minimum Age) Bill 2026
  regulator: eSafety
  regulator_full: Office of the eSafety Commissioner
  status: draft
  themes: [age_assurance]
  obligations:
    - ref: general
      summary: >-
        Would expand the Commissioner's compulsory information-gathering powers and double
        the maximum civil penalty for minimum-age contraventions.
      owner_function: [legal, policy]
      clock: null
      evidence_required: null
  deadlines:
    - date: 2026-12-31
      event: Passage expected during the 2026 parliamentary sittings
      certainty: speculative
  penalty:
    max_financial: Doubling of the current AUD 49.5 million maximum, as drafted
    basis: Civil penalty
    personal_liability: false
    non_financial: Wider notice powers
  enforcement_signals: []
  meta_exposure: Would apply to the same age-restricted platform set.
  sources:
    - title: Parliament of Australia — Bills and legislation
      url: https://www.aph.gov.au/Parliamentary_Business/Bills_Legislation
      kind: primary
      accessed: 2026-08-23
  confidence: low
  notes: >-
    Tracked because the operational consequence is notice volume, not penalty quantum.
    Wider compulsory powers means more statutory responses competing for the same SMEs.
  last_verified: 2026-08-23
  verified_by: B. Ong

- id: au-bose
  jurisdiction: Australia
  jurisdiction_code: AU
  instrument: Basic Online Safety Expectations and registered industry codes
  regulator: eSafety
  regulator_full: Office of the eSafety Commissioner
  status: in_force
  themes: [transparency_reporting, content_takedown]
  obligations:
    - ref: general
      summary: >-
        Respond to periodic transparency notices under legal compulsion, reporting on
        measures taken against specified categories of harmful material.
      owner_function: [policy, data, legal]
      clock: Set in each notice
      evidence_required: Metric definitions and lineage; consistency with prior notices
  deadlines: []
  penalty:
    max_financial: Civil penalties for failure to respond to a notice
    basis: Per-contravention
    personal_liability: false
    non_financial: Publication of non-compliance
  enforcement_signals: []
  meta_exposure: Meta services have received transparency notices under this framework.
  sources:
    - title: eSafety — Regulatory guidance
      url: https://www.esafety.gov.au/industry/regulatory-guidance
      kind: regulator
      accessed: 2026-08-23
  confidence: medium
  notes: >-
    Recurring rather than episodic. Cross-notice consistency is a standing risk — an answer
    given in one notice constrains every later one.
  last_verified: 2026-08-23
  verified_by: B. Ong
