# Japan
- id: jp-idpa
  jurisdiction: Japan
  jurisdiction_code: JP
  instrument: Information Distribution Platform Act
  instrument_local: 情報流通プラットフォーム対処法
  regulator: MIC
  regulator_full: Ministry of Internal Affairs and Communications
  status: in_force
  themes: [content_takedown, transparency_reporting, licensing]
  obligations:
    - ref: Art. 20(1)
      summary: >-
        Designated large-scale platform operators must expedite responses to
        rights-infringement notices and publish transparency disclosures.
      owner_function: [legal, ops, policy, data]
      clock: Expedited response to rights-infringement notices
      evidence_required: >-
        Enforcement disclosure metrics with documented lineage. Completeness is the
        supervised standard, not merely publication.
  deadlines: []
  penalty:
    max_financial: null
    basis: null
    personal_liability: false
    non_financial: Corrective recommendations; designation-linked supervision
  enforcement_signals:
    - date: 2026-07-24
      signal: >-
        MIC issued corrective recommendations to five designated operators — X Corp., Google,
        Meta Platforms, Shonan Seibu Home (bakusai.com) and Dwango (Niconico) — finding FY2025
        enforcement disclosures incomplete against a ministerial ordinance. MIC may issue
        formal corrective orders if the recommendations are not met without legitimate grounds.
      source: https://www.anews.com.tr/world/2026/07/24/japan-tells-x-google-to-improve-transparency-on-tackling-harmful-online-content
  meta_exposure: >-
    Meta is among the designated large-scale operators and publishes an annual IDPA
    transparency report covering Facebook, Instagram and Threads.
  sources:
    - title: Ministry of Internal Affairs and Communications — news releases
      url: https://www.soumu.go.jp/menu_news/
      kind: regulator
      accessed: 2026-08-23
    - title: Meta Transparency Center
      url: https://transparency.meta.com/
      kind: secondary
      accessed: 2026-08-23
    - title: "Japan tells X, Google to improve transparency on tackling harmful online content"
      url: https://www.anews.com.tr/world/2026/07/24/japan-tells-x-google-to-improve-transparency-on-tackling-harmful-online-content
      kind: secondary
      accessed: 2026-10-13
  confidence: low
  notes: >-
    Reporting-completeness findings are usually a data-lineage problem rather than a
    willingness problem — the report asks a question internal metrics were never shaped to
    answer. Confidence stays low because the July 2026 recommendation is still sourced to
    press reporting; re-verify against the MIC release before citing.
    Re-verified 2026-10-13: the recommendation is confirmed and dated 24 July 2026, with the
    five recipients named, Meta among them. Press reporting also places the Act in force from
    April 2025; the exact commencement date is not recorded here because it has not been
    confirmed against a primary source.
  last_verified: 2026-10-13
  verified_by: B. Ong
