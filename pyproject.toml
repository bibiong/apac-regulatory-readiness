[project]
name = "apac-regulatory-readiness"
version = "0.1.0"
description = "A maintained tracker of APAC platform regulation, plus the response workflow, AI toolkit and readiness framework built on top of it."
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0", "jsonschema>=4.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
