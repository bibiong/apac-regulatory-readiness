name: monthly check

# Runs on the 2nd of each month. Three jobs in one:
#   1. Verify the dataset still validates and the published site matches it.
#   2. Rebuild and push the site if it has drifted, so the live tracker is never
#      behind the data.
#   3. Open a dated issue listing what needs a human.
#
# What this deliberately does NOT do: touch `last_verified`. That field records that a
# person read a source and formed a view. A tracker whose freshness dates advance on a
# timer looks maintained while nobody is reading anything, which is worse than one that
# admits it is stale. The job gets you to the judgement call and stops.

on:
  schedule:
    # 01:00 UTC on the 2nd. The 2nd rather than the 1st avoids the heavy
    # month-boundary queue on shared runners.
    - cron: "0 1 2 * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build the report but do not push or open an issue"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: monthly-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt

      - name: Validate dataset
        run: python3 src/validate.py

      - name: Run tests
        run: python3 -m pytest tests/ -q

      # The build is a pure function of the dataset, so this is normally a no-op.
      # It is here to catch the case where data was committed without rebuilding —
      # the live tracker should never disagree with the dataset it claims to render.
      - name: Rebuild site and push if it drifted
        if: ${{ !inputs.dry_run }}
        run: |
          python3 src/build_site.py
          if git diff --quiet -- site/; then
            echo "site/ already matches the dataset — nothing to push"
          else
            echo "site/ was stale; committing the rebuild"
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add site/
            git commit -m "Rebuild site from dataset (monthly check)

          The published site had drifted from tracker/data/. Regenerated by the
          scheduled check; no regulatory facts were changed."
            git push
          fi

      - name: Build the re-verification report
        run: python3 src/report.py --links --case-study --out report.md

      - name: Open the monthly issue
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Re-verification due — $(date -u '+%B %Y')"
          # One issue per month. If a re-run happens in the same month, update the
          # existing issue rather than stacking duplicates on top of each other.
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" \
                       --json number,title \
                       --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1)
          if [ -n "$EXISTING" ]; then
            echo "updating issue #$EXISTING"
            gh issue edit "$EXISTING" --body-file report.md
          else
            echo "creating a new issue"
            gh issue create --title "$TITLE" --body-file report.md \
              --label "re-verification" || \
            gh issue create --title "$TITLE" --body-file report.md
          fi

      - name: Report summary
        run: cat report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: reverification-report
          path: report.md
